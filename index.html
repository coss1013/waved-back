<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ones Who Waved Back</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%235c231c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050505;
    --void-2:#111113;
    --bone:#e7e3da;
    --bone-dim:#8f887a;
    --accent:#5c231c;
    --accent-bright:#7a2f24;
    --line:rgba(231,227,218,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--void);
    color:var(--bone);
    font-family:'Source Serif 4', serif;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent-bright);
  }

  /* ---------- GATE ---------- */
  .gate{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--void);
    padding:8vw;
    text-align:center;
  }
  .gate.hidden{ display:none; }
  .gate .eyebrow{ margin-bottom:1.2rem; }
  .gate h1{
    font-family:'Fraunces', serif;
    font-weight:500; font-style:italic;
    font-size:clamp(2.2rem, 8vw, 3.6rem);
    color:var(--bone); margin:0 0 1.6rem;
    line-height:1.05;
  }
  .gate form{ display:flex; flex-direction:column; gap:0.9rem; width:100%; max-width:280px; }
  .gate input{
    font-family:'JetBrains Mono', monospace;
    font-size:1rem;
    padding:0.8rem 1rem;
    border:1px solid var(--line);
    background:var(--void-2);
    color:var(--bone);
    border-radius:2px;
  }
  .gate input:focus{ outline:1px solid var(--accent-bright); outline-offset:2px; }
  .gate input::placeholder{ color:var(--bone-dim); }
  .gate button{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.8rem 1rem;
    background:var(--accent);
    color:var(--bone);
    border:none; border-radius:2px; cursor:pointer;
    transition:background 0.2s ease;
  }
  .gate button:hover{ background:var(--accent-bright); }
  .gate .error{
    font-family:'JetBrains Mono', monospace;
    font-size:0.76rem;
    color:var(--accent-bright);
    min-height:1.2em;
  }
  body.locked > *:not(.gate){ display:none; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8vh 8vw 0;
    background:var(--void);
    overflow:hidden;
  }
  .hero .eyebrow{ margin-bottom:1.4rem; }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.8rem, 9vw, 6.5rem);
    line-height:0.98;
    margin:0;
    color:var(--bone);
    letter-spacing:-0.01em;
  }
  .hero p.tagline{
    font-size:clamp(1rem, 1.6vw, 1.2rem);
    max-width:36ch;
    color:var(--bone-dim);
    line-height:1.6;
    margin:1.6rem 0 0;
  }
  .hero .byline{
    margin-top:2.2rem;
    font-family:'JetBrains Mono', monospace;
    font-size:0.76rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }
  .begin-reading{
    margin-top:2.6rem;
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:0.82rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.9rem 1.6rem;
    background:var(--accent);
    color:var(--bone);
    border:1px solid var(--accent-bright);
    border-radius:2px;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .begin-reading:hover{ background:var(--accent-bright); transform:translateX(2px); }
  .hero-divider{
    display:block;
    width:64px;
    height:1px;
    background:var(--line);
    margin-top:5vh;
    position:relative;
  }
  .hero-divider::after{
    content:'';
    position:absolute;
    left:0; top:-2px;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--accent-bright);
  }

  /* ---------- TABLE OF CONTENTS ---------- */
  .toc-toggle{
    position:fixed; top:1.2rem; right:1.2rem; z-index:50;
    background:none; border:none;
    color:#ffffff;
    mix-blend-mode:difference;
    font-size:1.5rem; line-height:1;
    padding:0.5rem;
    cursor:pointer;
    opacity:0.9;
    transition:opacity 0.2s ease;
  }
  .toc-toggle:hover{ opacity:1; }
  .toc-overlay{
    position:fixed; inset:0; z-index:59;
    background:rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .toc-overlay.open{ opacity:1; pointer-events:auto; }
  .toc-panel{
    position:fixed; top:0; right:0; bottom:0; z-index:60;
    width:min(360px, 86vw);
    background:var(--void-2);
    box-shadow:-6px 0 30px rgba(0,0,0,0.5);
    padding:3rem 1.8rem 2rem;
    overflow-y:auto;
    transform:translateX(100%);
    transition:transform 0.4s cubic-bezier(.4,0,.2,1);
    border-left:1px solid var(--line);
  }
  .toc-panel.open{ transform:translateX(0); }
  .toc-title{
    font-family:'Fraunces', serif;
    font-weight:500; font-style:italic;
    font-size:1.5rem;
    margin:0.5rem 0 2rem;
    color:var(--bone);
  }
  .toc-row{
    display:flex; align-items:baseline; gap:0.9rem;
    padding:1rem 0.2rem;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .toc-row:hover{ background:rgba(92,35,28,0.15); }
  .toc-num{
    font-family:'JetBrains Mono', monospace;
    font-size:0.74rem;
    color:var(--accent-bright);
    min-width:2rem;
  }
  .toc-label{
    font-family:'Fraunces', serif;
    font-size:1.02rem;
    color:var(--bone);
  }

  /* ---------- READER ---------- */
  .reader{
    position:fixed; inset:0;
    background:var(--void);
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform 0.45s cubic-bezier(.4,0,.2,1);
    z-index:20;
  }
  .reader.open{ transform:translateY(0); }
  .reader-inner{
    max-width:660px;
    margin:0 auto;
    padding:10vh 6vw 18vh;
  }
  @media (min-width:1025px){
    .reader-inner{ max-width:820px; }
    .reader-text p{ font-size:1.2rem; line-height:1.9; }
  }
  .reader-top{ display:flex; justify-content:space-between; align-items:center; }
  .back-link{
    position:fixed; top:1.2rem; left:1.2rem; z-index:50;
    background:none; border:none;
    color:#ffffff;
    mix-blend-mode:difference;
    font-size:1.4rem; line-height:1;
    padding:0.5rem;
    cursor:pointer;
    opacity:0.9;
    transition:opacity 0.2s ease;
  }
  .back-link:hover{ opacity:1; }
  .reader-eyebrow{ margin-bottom:0.6rem; }
  .reader h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(2rem, 5vw, 3.1rem);
    margin:0 0 3rem;
    line-height:1.05;
    color:var(--bone);
  }
  .reader-text p{
    font-size:1.12rem;
    line-height:1.85;
    margin:0 0 1.5rem;
    color:var(--bone);
  }
  .reader-text em{ color:var(--bone-dim); font-style:italic; }
  .epigraph{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.3rem, 3vw, 1.7rem);
    line-height:1.5;
    color:var(--accent-bright);
    margin:0 0 3rem;
    padding:0 0 2rem;
    border-bottom:1px solid var(--line);
  }
  .reader-text:not(.paginated) p:first-of-type::first-letter{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:3.2rem;
    float:left;
    line-height:0.8;
    padding-right:0.5rem;
    padding-top:0.4rem;
    color:var(--accent-bright);
  }
  .lead-para::first-letter{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:3.2rem;
    float:left;
    line-height:0.8;
    padding-right:0.5rem;
    padding-top:0.4rem;
    color:var(--accent-bright);
  }
  .reader-nav{
    display:flex;
    justify-content:center;
    margin-top:4rem;
    padding-top:1.6rem;
    border-top:1px solid var(--line);
  }
  .another-case{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--bone-dim);
    background:none;
    border:1px solid var(--line);
    border-radius:2px;
    padding:0.7rem 1.4rem;
    cursor:pointer;
    transition:color 0.2s ease, border-color 0.2s ease;
  }
  .another-case:hover{ color:var(--bone); border-color:var(--accent-bright); }

  @media (max-width:1024px){
    .reader-inner{ padding-top:7vh; padding-bottom:14vh; }
    .reader-top{ margin-bottom:2.8rem; }
    .reader-text p{ font-size:1.08rem; line-height:1.7; margin-bottom:1.3rem; }
  }

  @media (max-width:640px){
    .hero{ padding:10vh 7vw 0; }
    .reader-inner{ padding-top:5.5vh; padding-bottom:2vh; padding-left:9vw; padding-right:9vw; }
    .reader-top{ margin-bottom:1.8rem; }
    .reader-eyebrow{ display:none; }
    .reader h2{ display:none; }
    .reader-text p{ font-size:0.99rem; line-height:1.55; margin-bottom:1rem; }
    .epigraph{ font-size:1.2rem; margin-bottom:1.8rem; padding-bottom:1.2rem; }
    .reader-nav{ margin-top:2.4rem; padding-top:1.2rem; }
    .pager-hint{ display:block; }
  }

  /* ---------- PAGER (mobile swipe pagination) ---------- */
  .pager{ position:relative; }
  .pager.paginated{ overflow:hidden; touch-action:pan-y; cursor:pointer; }
  .pager-track{ transition:transform 0.38s cubic-bezier(.22,.61,.36,1); }
  .pager.paginated .pager-track{ display:flex; align-items:stretch; height:100%; }
  .title-page{
    display:none;
    flex:0 0 auto;
    box-sizing:border-box;
    flex-direction:column;
    justify-content:center;
    padding:0 6vw;
    background:var(--void);
  }
  .pager.paginated .title-page{ display:flex; }
  .title-num{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(3.6rem, 20vw, 5.5rem);
    line-height:0.8;
    color:rgba(231,227,218,0.14);
    margin:0 0 0.5rem;
  }
  .title-page .eyebrow{ margin-bottom:1rem; }
  .title-page h3{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2.2rem, 11vw, 3.2rem);
    line-height:1.05;
    color:var(--bone);
    margin:0;
  }
  .title-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:0.74rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent-bright);
    margin:1.3rem 0 0;
    padding-top:1.1rem;
    border-top:1px solid var(--line);
    display:inline-block;
  }
  .reader-text.paginated{ flex:0 0 auto; box-sizing:border-box; overflow:hidden; }
  .pager-hint{
    display:none;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bone-dim);
    text-align:center;
    margin:0.9rem 0 0;
    opacity:0.75;
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <p class="eyebrow">private, for now</p>
  <h1>The Ones Who Waved Back</h1>
  <form id="gateForm" autocomplete="off">
    <input type="password" id="gateInput" placeholder="Password" autofocus>
    <button type="submit">Enter</button>
    <p class="error" id="gateError"></p>
  </form>
</div>

<button class="toc-toggle" id="tocToggle" aria-label="Open contents">&#9776;</button>
<div class="toc-overlay" id="tocOverlay"></div>
<div class="toc-panel" id="tocPanel">
  <p class="eyebrow">Contents</p>
  <h2 class="toc-title">The Ones Who Waved Back</h2>
  <div class="toc-list" id="tocList"></div>
</div>

<section class="hero">
  <p class="eyebrow">short takes, unnamed</p>
  <h1>The Ones Who Waved Back</h1>
  <p class="tagline">Nine voices. Ordinary, until they aren't.</p>
  <p class="byline">By Alan N. Grier</p>
  <button class="begin-reading" id="beginReading">Begin Reading &rarr;</button>
  <span class="hero-divider"></span>
</section>

<div class="reader" id="reader">
  <div class="reader-inner">
    <div class="reader-top"></div>
    <p class="eyebrow reader-eyebrow" id="readerEyebrow"></p>
    <h2 id="readerTitle"></h2>
    <div class="pager" id="pager">
      <div class="pager-track" id="pagerTrack">
        <div class="title-page" id="titlePage">
          <p class="title-num" id="titleNum"></p>
          <p class="eyebrow" id="titleEyebrow"></p>
          <h3 id="titleHeading"></h3>
          <p class="title-sub" id="titleSub"></p>
        </div>
        <div class="reader-text" id="readerText"></div>
      </div>
    </div>
    <p class="pager-hint" id="pagerHint">swipe or tap to begin</p>
    <div class="reader-nav">
      <button class="another-case" id="anotherCase">Next Case &rarr;</button>
    </div>
  </div>
</div>

<button class="back-link" onclick="closeReader()" aria-label="Back to homepage">&larr;</button>

<script>
const stories = [
  {
    id:"crawl-space", title:"Crawl Space",
    text:`I don't understand the struggle. I'm above the work involved to show my love. These boys are my everything; I've done everything for them. I chose them as my pupils, taught them the trade, and gave them a place to escape their frustrating lives and those who never seemed to care. I care; I love them. I've seen them at their best and worst; happy and sad; strong and vulnerable; confident and weak. I was there through it all. I needed them more than I ever needed anyone else because they belonged to me.`
  },
  {
    id:"on-the-road-again", title:"On the Road Again",
    text:`Switching radio stations as I pass from one State to another makes it all worth the trips. When one passes into static, there's another with a strong signal; it was the signal of a new county line, State border, or a random tower that powered over the miles of power lines you'll find yourself driving under all across the western part of the country. From Washington to Utah, the Top 40s would vary ever so slightly. Maybe it was the teasing airwaves of Los Angeles; maybe it was conservative doctrines of Mormon country. Regardless, it was bliss; each trip to meet a new lover or a return trip to one most dear.`
  },
  {
    id:"coming-of-age", title:"Coming of Age",
    text:`It's… it's… nice to call this place home. I… umm… I didn't hate living with my grandma, but it… wasn't me. I needed a place I could nurture, decorate, and call my own. At first, it was lonely. There's really no way around it. But I found friends—people I loved—in my proximity to downtown. It was the beginning of a new era in my life. I… umm… never knew so much about myself. I came to learn love. Though it sometimes comes and goes… as I'm sure has happened to everyone. Each lover is… *long pause* a totem… and lesson learned. No matter our… I don't know… differences… I will always love them.`
  },
  {
    id:"maroon-truck", title:"Maroon Truck",
    text:`Sometimes, something as silly as truck becomes your identity. When I bought mine, I identified with it. Hell, I think I loved it more than anything. In the 80s, trucks shifted different. When I do dropped it into drive, the motor grew to a mouth-watering RPM before it finally shifted, unlike my last truck in the early 2000s. People called it brown or rust-colored, but she was maroon. When they say it, they knew it was me. I took great care of it, like women did took care of me. They loved it just as much that I became confident behind its sun-burned steering wheel and cracked door panels. I always took them to my home and shared myself with them but, now that I think about it, they always saw my confidence.`
  },
  {
    id:"kenneth-and-stevie", title:"Kenneth and Stevie",
    text:`It was like an AA meeting. I remember saying, "I'm Kenneth." It was relaxing; the group supported me. But, something shifted. They wanted me to be a part of the conversation but I was no fool; it was a test, testimonial, and desire to cripple me. At one point, it crippled me. Why so much pressure when I'm trying to share my feelings. Stevie stepped in next to me. He fucking hated these motherfuckers. He wanted answers and, in turn, wanted those persecutors dead. He unleashed a stream of profanities to protect me from the interrogation. I only knew his name afterward I came to; he showed up when I least expected it, protecting me from their verbal assault. At one point, he leaned in close as said, "Angelo will keep us safe."`
  },
  {
    id:"mom-knows-best", title:"Mom Knows Best",
    text:`[Mr. Alan Nelson Grier; childhood friend] Having been raised in the sticks, it's sometimes difficult to know yourself. It didn't help in the old days, when many were illiterate; never being exposed to what we take for granted: education, growth, or societal development. It makes it worse when an individual is completely uneducated, mentally unstable, and unsure of their future. I moved on, but he didn't have the capacity to do the same. While his mother, God rest her soul, pushed harder than I knew, he was safe as far was we knew. I, unfortunately, was too far away to help when he needed it. But, then again, I never knew. I was told later that he was haunted. But he seemed to become stronger, using the moonlit night as an escape from his mother; confronting his fears. In all honesty, he just needed love. No matter how much he grew and how hard he tried to drive the demons within him, the darkest never passed until he crafted his own light.`
  },
  {
    id:"concierge", title:"Concierge",
    text:`[Review of the World's Fair Hotel by Allen N. Grier, Chicago Tribune] Come down to the neighborhood of ENGLEWOOD and enjoy the lavish accommodations of the World's Fair Hotel. NEWLY renovated and in HIGH demand, this three-story structure is close to the greatest sites in Chicago and in the process of a complete reconstruction. COME now and save on your first visit. Recent reviews have stated, "I LOVED the location because I could walk to the shops and avoid taking the train across town." Another said, "The hotel was the PERFECT location to dress in my finest garbs, exploring the district of high-end shops before returning to incredible DRINKS that take hold." The World's Fair Hotel is the perfect trip for loving couples, where they can explore in style; where they can drink, laugh, and lay their heads in peace.`
  },
  {
    id:"icicles-in-new-york", title:"Icicles in New York",
    text:`*Clicks tongue* Christmas is my favorite time of the year. Uh… the kids… they loved opening presents and I enjoyed putting their toys together. The tree… it shined brightly during the snowy night… well, this particular year. Even in the early-morning darkness of the home. Every year, I looked forward to that morning reveal… *clicks tongue* That Christmas Eve night, I had to close a business deal. After the kids finally fell asleep, I says to the wife, I gotta do this thing. On a snowy night, I drove from our Jersey home in the ice-cold night to Brooklyn to collect my family's final Christmas present. *Clicks tongue* I made it back in time to put the kids' presents together. Before that… I delivered the hard-earned gift to the missus.`
  },
  {
    id:"ciphers", title:"Ciphers",
    text:`It's interesting that the dark, mysterious parts of life are in the dark. Centuries before our time, people feared the dark, and it hasn't changed since. Be it the absence of the sun, the deepest parts of the ocean, or the unobtainable depths of space and time, the imagination wanders in ways that triggers the human mind into prayer. Looking up to the heavens, even during the light of day, rarely do the stars align for comfort. In the past, people used the stars for navigation; now they use it to predict their good-fortune of the day. The Zodiac signs don't care.`
  }
];

function emphasize(t){ return t.replace(/\*(.+?)\*/g, "<em>$1</em>"); }
function isEpigraph(p){
  return /^["“'‘].*["”'’]\s*$/.test(p) && p.length < 160 && !p.includes("\n");
}
function caseNum(i){ return String(i+1).padStart(2, "0"); }

// ---------- CONTENTS ----------
const tocList = document.getElementById("tocList");
stories.forEach((s, i) => {
  const row = document.createElement("div");
  row.className = "toc-row";
  row.tabIndex = 0;
  row.setAttribute("role","button");
  row.innerHTML = `<span class="toc-num">${caseNum(i)}</span><span class="toc-label">${s.title}</span>`;
  const open = () => { openReader(s.id); closeTOC(); };
  row.addEventListener("click", open);
  row.addEventListener("keydown", ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); open(); } });
  tocList.appendChild(row);
});

const tocPanel = document.getElementById("tocPanel");
const tocOverlay = document.getElementById("tocOverlay");
function openTOC(){ tocPanel.classList.add("open"); tocOverlay.classList.add("open"); }
function closeTOC(){ tocPanel.classList.remove("open"); tocOverlay.classList.remove("open"); }
document.getElementById("tocToggle").addEventListener("click", openTOC);
tocOverlay.addEventListener("click", closeTOC);

document.getElementById("beginReading").addEventListener("click", () => {
  openReader(stories[0].id);
});
document.getElementById("anotherCase").addEventListener("click", () => {
  const idx = stories.findIndex(x => x.id === currentId);
  const next = stories[(idx + 1) % stories.length]; // loops back to the first after the last
  openReader(next.id);
});

// ---------- READER ----------
const reader = document.getElementById("reader");
let currentId = null;
let currentEntryRef = null;

function openReader(id){
  const s = stories.find(x => x.id === id);
  if(!s) return;
  currentId = id;
  currentEntryRef = s;
  const idx = stories.findIndex(x => x.id === id);

  document.getElementById("readerEyebrow").textContent = `Case No. ${caseNum(idx)}`;
  document.getElementById("readerTitle").textContent = s.title;
  document.getElementById("titleNum").textContent = caseNum(idx);
  document.getElementById("titleEyebrow").textContent = "Case File";
  document.getElementById("titleHeading").textContent = s.title;
  document.getElementById("titleSub").textContent = `No. ${caseNum(idx)}`;

  const textEl = document.getElementById("readerText");
  const paras = s.text.split("\n\n").map(p => p.trim());
  let bodyParas = paras;
  let html = "";
  if(isEpigraph(paras[0])){
    html += `<blockquote class="epigraph">${emphasize(paras[0])}</blockquote>`;
    bodyParas = paras.slice(1);
  }
  html += bodyParas.map(p => `<p>${emphasize(p)}</p>`).join("");
  textEl.innerHTML = html;

  reader.classList.add("open");
  reader.scrollTop = 0;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(layoutPagination);
}

function closeReader(){
  reader.classList.remove("open");
  document.body.style.overflow = "";
  currentId = null;
}

document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && currentId) closeReader();
});

// ---------- GATE ----------
// Change the word below to set your own password. That's the only edit needed.
const SITE_PASSWORD = "waved";

document.body.classList.add("locked");
document.getElementById("gateForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  const val = document.getElementById("gateInput").value.trim().toLowerCase();
  if(val === SITE_PASSWORD.toLowerCase()){
    document.body.classList.remove("locked");
    document.getElementById("gate").classList.add("hidden");
  } else {
    document.getElementById("gateError").textContent = "Not quite — try again.";
    document.getElementById("gateInput").value = "";
    document.getElementById("gateInput").focus();
  }
});

// ---------- PAGER (mobile swipe pagination) ----------
function isMobilePaged(){
  return window.matchMedia("(max-width:640px)").matches;
}

function buildPages(s, pageW, availH){
  const paras = s.text.split("\n\n").map(p => p.trim());
  let bodyParas = paras;
  const blocks = [];
  if(isEpigraph(paras[0])){
    blocks.push({type:"epigraph", text:paras[0]});
    bodyParas = paras.slice(1);
  }
  bodyParas.forEach((p, i) => {
    blocks.push({type:"p", text:p, lead:(i === 0)});
  });

  const probe = document.createElement("div");
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.left = "-9999px";
  probe.style.top = "0";
  probe.style.width = pageW + "px";
  probe.className = "reader-text paginated";
  document.body.appendChild(probe);

  function nodeFor(block, text, lead){
    const wrapper = document.createElement("div");
    if(block.type === "epigraph"){
      wrapper.innerHTML = `<blockquote class="epigraph">${emphasize(text)}</blockquote>`;
    } else {
      wrapper.innerHTML = `<p${lead ? ' class="lead-para"' : ""}>${emphasize(text)}</p>`;
    }
    return wrapper.firstElementChild;
  }

  function measure(node){
    probe.appendChild(node);
    const h = node.getBoundingClientRect().height + parseFloat(getComputedStyle(node).marginBottom || "0");
    probe.removeChild(node);
    return h;
  }

  const pages = [];
  let currentHtml = [];
  let currentHeight = 0;

  function flushPage(){
    pages.push(currentHtml.join(""));
    currentHtml = [];
    currentHeight = 0;
  }

  blocks.forEach(block => {
    if(block.type === "epigraph"){
      const node = nodeFor(block, block.text, false);
      const h = measure(node);
      if(currentHtml.length > 0 && currentHeight + h > availH) flushPage();
      currentHtml.push(node.outerHTML);
      currentHeight += h;
      return;
    }

    let remaining = block.text;
    let isContinuation = false;

    while(remaining.length){
      const lead = block.lead && !isContinuation;
      const fullNode = nodeFor(block, remaining, lead);
      const fullH = measure(fullNode);

      if(currentHeight + fullH <= availH){
        currentHtml.push(fullNode.outerHTML);
        currentHeight += fullH;
        remaining = "";
        break;
      }

      const words = remaining.split(" ");
      let lo = 1, hi = words.length, best = 0;
      while(lo <= hi){
        const mid = Math.floor((lo + hi) / 2);
        const candText = words.slice(0, mid).join(" ");
        const candNode = nodeFor(block, candText, lead);
        const candH = measure(candNode);
        if(currentHeight + candH <= availH){ best = mid; lo = mid + 1; }
        else { hi = mid - 1; }
      }

      if(best === 0){
        if(currentHtml.length === 0){
          best = 1;
        } else {
          flushPage();
          continue;
        }
      }

      const fitText = words.slice(0, best).join(" ");
      const fitNode = nodeFor(block, fitText, lead);
      const fitH = measure(fitNode);
      currentHtml.push(fitNode.outerHTML);
      currentHeight += fitH;
      remaining = words.slice(best).join(" ");
      isContinuation = true;
      flushPage();
    }
  });

  if(currentHtml.length) flushPage();

  document.body.removeChild(probe);
  return pages.length ? pages : [""];
}

let pageIndex = 0, totalTextPages = 1;

function layoutPagination(){
  const pager = document.getElementById("pager");
  const track = document.getElementById("pagerTrack");
  const titlePage = document.getElementById("titlePage");
  const textEl = document.getElementById("readerText");

  track.querySelectorAll(".page-slide").forEach(el => el.remove());

  if(!isMobilePaged()){
    pager.classList.remove("paginated");
    textEl.style.display = "";
    titlePage.style.width = "";
    titlePage.style.height = "";
    track.style.transform = "";
    pager.style.height = "";
    return;
  }

  if(!currentEntryRef) return;

  pager.classList.add("paginated");
  textEl.style.display = "none";

  const top = pager.offsetTop;
  const footerAllowance = 120;
  const availH = Math.max(280, window.innerHeight - top - footerAllowance);
  pager.style.height = availH + "px";
  titlePage.style.height = availH + "px";

  const pageW = pager.clientWidth;
  titlePage.style.width = pageW + "px";

  const pages = buildPages(currentEntryRef, pageW, availH);
  totalTextPages = pages.length;

  pages.forEach(html => {
    const slide = document.createElement("div");
    slide.className = "page-slide reader-text paginated";
    slide.style.width = pageW + "px";
    slide.style.height = availH + "px";
    slide.innerHTML = html;
    track.appendChild(slide);
  });

  pageIndex = 0;
  applyPageTransform();
  updateHint();
}

function applyPageTransform(){
  const pager = document.getElementById("pager");
  const track = document.getElementById("pagerTrack");
  const pageW = pager.clientWidth;
  track.style.transform = `translateX(${-pageIndex * pageW}px)`;
}

function updateHint(){
  const hint = document.getElementById("pagerHint");
  if(!isMobilePaged()) return;
  hint.textContent = pageIndex === 0 ? "swipe or tap to begin" : `page ${pageIndex} of ${totalTextPages}`;
}

function goToPage(delta){
  const totalSlots = totalTextPages + 1;
  const next = pageIndex + delta;
  if(next < 0) return;
  if(next >= totalSlots){
    document.getElementById("anotherCase").click();
    return;
  }
  pageIndex = next;
  applyPageTransform();
  updateHint();
}

(function setupSwipe(){
  const pager = document.getElementById("pager");
  let startX = 0, startY = 0;
  pager.addEventListener("touchstart", ev => {
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
  }, {passive:true});
  pager.addEventListener("touchend", ev => {
    if(!isMobilePaged()) return;
    const dx = ev.changedTouches[0].clientX - startX;
    const dy = ev.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      goToPage(dx < 0 ? 1 : -1);
    }
  }, {passive:true});

  // Tap-to-turn fallback (like Kindle's app): tap the right side to advance,
  // left side to go back. Covers any environment where swipe isn't recognized
  // — desktop mouse clicks, embedded previews, etc.
  pager.addEventListener("click", ev => {
    if(!isMobilePaged()) return;
    const rect = pager.getBoundingClientRect();
    const tapX = ev.clientX - rect.left;
    goToPage(tapX < rect.width * 0.35 ? -1 : 1);
  });
})();

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(currentId) layoutPagination(); }, 150);
});
window.addEventListener("load", () => { if(currentId) layoutPagination(); });
</script>
