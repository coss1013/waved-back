  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--void-gradient);
    color:var(--bone);
    font-family:'Source Serif 4', serif;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent-bright);
  }

  /* ---------- GATE ---------- */
  .gate{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--void-gradient);
    padding:8vw;
    text-align:center;
  }
  .gate.hidden{ display:none; }
  .gate .eyebrow{ margin-bottom:1.2rem; }
  .gate h1{
    font-family:'Fraunces', serif;
    font-weight:500; font-style:italic;
    font-size:clamp(2.2rem, 8vw, 3.6rem);
    color:var(--bone); margin:0 0 1.6rem;
    line-height:1.05;
  }
  .gate form{ display:flex; flex-direction:column; gap:0.9rem; width:100%; max-width:280px; }
  .gate input{
    font-family:'JetBrains Mono', monospace;
    font-size:1rem;
    padding:0.8rem 1rem;
    border:1px solid var(--line);
    background:var(--void-2);
    color:var(--bone);
    border-radius:2px;
  }
  .gate input:focus{ outline:1px solid var(--accent-bright); outline-offset:2px; }
  .gate input::placeholder{ color:var(--bone-dim); }
  .gate button{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.8rem 1rem;
    background:var(--accent);
    color:var(--bone);
    border:none; border-radius:2px; cursor:pointer;
    transition:background 0.2s ease;
  }
  .gate button:hover{ background:var(--accent-bright); }
  .gate .error{
    font-family:'JetBrains Mono', monospace;
    font-size:0.76rem;
    color:var(--accent-bright);
    min-height:1.2em;
  }
  body.locked > *:not(.gate){ display:none; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    padding:8vh 8vw;
    background:var(--void-lit);
    overflow:hidden;
  }
  .hero-paper{
    background-image:var(--paper-photo);
    background-size:100% 100%;
    background-repeat:no-repeat;
    padding:clamp(3rem, 6vw, 5rem) clamp(2.5rem, 6vw, 4.5rem);
    max-width:640px;
    width:100%;
    box-sizing:border-box;
    filter:drop-shadow(0 24px 44px rgba(0,0,0,0.7));
    transform:rotate(-0.8deg);
  }
  .hero-paper .eyebrow{ margin-bottom:1.4rem; color:var(--paper-accent); }
  .hero-paper h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.2rem, 7vw, 4.6rem);
    line-height:0.98;
    margin:0;
    color:var(--ink-dark);
    letter-spacing:-0.01em;
  }
  .hero-paper p.tagline{
    font-size:clamp(1rem, 1.6vw, 1.2rem);
    max-width:36ch;
    color:var(--ink-dim);
    line-height:1.6;
    margin:1.6rem 0 0;
  }
  .hero-paper .byline{
    margin-top:2.2rem;
    font-family:'JetBrains Mono', monospace;
    font-size:0.76rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .begin-reading{
    margin-top:2.6rem;
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:0.82rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:0.9rem 1.6rem;
    background:var(--accent);
    color:var(--bone);
    border:1px solid var(--accent-bright);
    border-radius:2px;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .begin-reading:hover{ background:var(--accent-bright); transform:translateX(2px); }

  /* ---------- TABLE OF CONTENTS ---------- */
  .toc-toggle{
    position:fixed; top:1.2rem; right:1.2rem; z-index:50;
    background:none; border:none;
    color:#ffffff;
    mix-blend-mode:difference;
    font-size:1.5rem; line-height:1;
    padding:0.5rem;
    cursor:pointer;
    opacity:0.9;
    transition:opacity 0.2s ease;
  }
  .toc-toggle:hover{ opacity:1; }
  .toc-overlay{
    position:fixed; inset:0; z-index:59;
    background:rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .toc-overlay.open{ opacity:1; pointer-events:auto; }
  .toc-panel{
    position:fixed; top:0; right:0; bottom:0; z-index:60;
    width:min(360px, 86vw);
    background:var(--void-2);
    box-shadow:-6px 0 30px rgba(0,0,0,0.5);
    padding:3rem 1.8rem 2rem;
    overflow-y:auto;
    transform:translateX(100%);
    transition:transform 0.4s cubic-bezier(.4,0,.2,1);
    border-left:1px solid var(--line);
  }
  .toc-panel.open{ transform:translateX(0); }
  .toc-title{

  /* ---------- PAGER (mobile swipe pagination) ---------- */

<script>
const stories = [
  {
    id:"crawl-space", title:"Crawl Space",
    text:`I don't understand why the struggle. I'm beyond this nonsense; I'm above the work involved. These boys are my proteges; I done everything for them, I chose 'em as my pupils, I taught 'em the trade. I gave 'em a place to escape their lives and avoid those that did'n care. I care; I love 'em. I seen 'em at their best and worst; happy and sad; strong and vulnerable; confident and weak. I was there through it all. I needed them more than I ever needed anyone else. I did'n jus' need them; they belonged to me.`
  },
  {
    id:"kenneth-and-stevie", title:"Kenneth and Stevie", intro:"Interrogation recorded by Sgt. Grier of the L.A.P.D.",
    text:`“It was like an AA meeting. I remember saying, ‘I'm Kenneth. I'm here to receive your help.’ It was relaxing; the group supported me. But something shifted. They wanted me to be a part of a bigger conversation. I was no fool; it was a test, a testimonial, and a desire to cripple me. At one point, it did. Why so much pressure when I'm trying to share my feelings? Stevie stepped in to protect me. He fucking hated those motherfuckers. He wanted answers and, in turn, wanted those persecutors dead. He unleashed a stream of profanities to protect me from the interrogation. I discovered his name the first time he started protecting me. Weeks into the horrible ordeal, he leaned in close, his lips brushing my cheek, and said, ‘Angelo will keep us safe.’”`
  },
  {
    id:"on-the-road-again", title:"On the Road Again",
    text:`Switching radio stations only is worth the trip. When one station passes into static, there's another right behind it. Maybe it's the state line or a random tower whose signal struck over it. You find yourself driving under them as you progress across the western part of the country. From Washington to Utah, the Top 40s would vary ever so slightly. Maybe it was the teasing airwaves of Los Angeles; maybe it was conservative doctrines of Mormon country. Regardless, it was bliss; each trip led me to a new lover or a former one I hold most dear.`
  },
  {
    id:"concierge", title:"Concierge", adStyle:true, intro:"Review of the World's Fair Hotel by Allen N. Grier; unknown submission to the Chicago Tribune",
    text:`Come down to the ENGLEWOOD neighborhood and enjoy the lavish accommodations at the WORLD'S FAIR HOTEL. NEWLY renovated and in HIGH demand, this three-story structure shares proximity to the best sites in Chicago. COME now and save on your first visit. Recent reviews have stated, "I LOVED the location, explored the neighboring shops, and AVOIDED the train across town." Another said, "The hotel was the PERFECT location to dress in my finest and explore the district of high-end shops. Though I visited in a state of reconstruction, returning from a long day of sightseeing, the miss and I returned in the evening to considerable service and incredible DRINKS that took hold." The World's Fair Hotel is the perfect trip for LOVING COUPLES, where they can explore in style; drinking, laughing, and laying their heads in peace.`
  },
  {
    id:"coming-of-age", title:"Coming of Age", intro:"Interview transcribed by A. Grier",
    text:`“It's… uhh… nice to call this place home. I… I... didn't hate living with my grandma; it just didn't work for me. I needed a place I could nurture and call my own. At first, it was lonely—a fish tank, a nosy neighbor; there's really no way around it. But I found friends—people I loved in the proximity to downtown. It was the beginning of a new era. I… never knew much about myself until I socialized with others, exploring the nightlife with those more like me. Love came and went… as I'm sure it does for everyone. Each lover is… a totem; a lesson learned. No matter our… I don't know… differences… I will always love them.”`
  },
  {
    id:"icicles-in-new-york", title:"Icicles in New York", intro:"Abandoned cassette tape, found and filed by A. Neal Grier",
    text:`“Christmas was my favorite time. The... kids… loved opening presents, and I enjoyed putting them together. The tree… it shined brightly during the snowy night. Every year... I looked forward to that morning reveal…” *Clicks tongue* “One Christmas Eve night, I had to close a business deal unexpectedly. After the kids fell asleep, I says to the wife, ‘I gotta do a thing.’ That snowy night, I drove from Jersey to Brooklyn to collect my family's final Christmas present.” *Clicks tongue* “It didn't take long; not like other deals of suggestive negotiation and elbow grease. I made it back before the kids awoke and helped them assemble their presents. They were jumping up and down as they ripped silver-colored paper from a bike, paddle car, and Barbie doll. *Soft chuckle* Before that, I delivered my hard-earned gift to the missus.”`
  },
  {
    id:"mom-knows-best", title:"Mom Knows Best", intro:"Interview with Mr. Alan Nelson Grier, self-described childhood friend",
    text:`“Having been raised in the sticks, it can be difficult to discover yourself. Family duties and chores would occasionally take you out of school. In his case, he never went to school. Like a small populace of this forgotten town, he was illiterate. He was never exposed to education, success, or societal development. It makes it worse when you take into account that he was mentally unstable, with no future. There was nothing to reach for that wasn't already buried around him. I moved on, but he couldn't. While his mother, God rest her soul, pushed on to protect him, we all thought he was safe and happy. Unfortunately, I was too far away to help when he needed it. By that time, I never knew. I was told later that he was haunted, using the night as an escape from his mother. He needed love. No matter how he grew or how hard he tried to drive the demons from him, the darkest never passed until he crafted his own light.”`
  },
  {
    id:"ciphers", title:"Ciphers", intro:"An unidentified letter from A.N.G., sent to the San Francisco Chronicle, 1974",
    text:`“Puzzles are scientifically proven to help with memory and cognitive function; someone once said that they helped prevent dementia. I don't know if that's true. How many people are needed to prove that evidence true? If it's true, does the puzzle need to have 200 pieces? Should it be 500, 1000, 10,000? How does one confirm its effectiveness? There was a time when puzzles helped me with my depression, helped with my headaches, helped with existence. I know you won't publish this letter in your world-renowned paper, but I felt it was worth writing you one last time—what fun we had over the years; what puzzles we solved; what anguish we shared. When you look to the heavens, day or night, the stars are always there; no longer for navigation, but to predict the future. What future that might be, only the Zodiac signs know.”`
  },
  {
    id:"circle", title:"Circle", intro:"Found by Lt. Grier after a noise complaint*",
    text:`It doesn't matter who you are; the thoughts exist. We all fall, we fail, we give up. A vertical rope aligns someone, or it marks passage above and below. It's there as you descend; it fights against you when you resist; it restricts when you struggle. How it presents itself depends on the person. When it appears in one's life depends on whether it touches you in early life or later. Its coarse windings can be harsh, slick, burning, or torturous to the touch. It can exist simply as a horizontal toy; two or more friends pulling to decide the winner of a playful game. It can personify itself as a lifeline when things get tough; a family on the other end pulling you to refuge. For some, it represents the afterlife. It hangs as a loop of promise; one of final comfort; a caring form, only a special few have felt. It beckons most lovingly: "Follow me, follow me. Everything I wanted, everything I asked for, my ends are now. I won't let this build up inside of me."`,
    outro:"*You know who you are."
  },
  {
    id:"fantasy-rehearsal-model", title:"The Fantasy Rehearsal Model",
    text:`The most logical connection between two points is a straight line. In terms of time and distance, there is no argument. Even electricity has an instinctual nature to choose the shortest path, bypassing a complicated, calculated wiring scheme to ground out at first touch. This pattern seems to hold true throughout nature, biology, and physics on Earth. Every once in a while, a new point surfaces. This outlier lies far beyond the original two, but becomes the new omega. It could be a light-year away from the originals, yet the alpha chooses it over the safer endpoint. This phenomenon is so rare, it's difficult to predict where it'll turn up. But when it does, lives are destroyed.`
  },
  {
    id:"even-angels-rot-on-nightly-sins", title:"Even Angels Rot on Nightly Sins",
    text:`Every culture has stories surrounding the dark. From the boogeymen to the Wild Hunt, tales have been spun to raise anxieties when the sun falls beyond the horizon. Many say these creatures were conjured by humanity to scare children, paralyzing them so they don't wake their parents in the night. The bedroom and, specifically, the bed seem protected by angels. But that's the thing about fairytales; the real monsters scare the angels away. Some of them stick around, hiding in the shadows, unable to look away; unwilling to help. They watch as the monsters take the innocence away. It turns out no bed is safe.`
  },
  {
    id:"maroon-truck", title:"Maroon Truck",
    text:`Sometimes, something as silly as a truck becomes your identity. When I bought mine, I identified with it. Hell, I think I loved it more than anything. In the 80s, trucks drove differently. When I put it into gear, the motor grew to a mouth-watering hum before it finally shifted. It was different from my truck later in the early 2000s. People described it as brown or rust-colored, but she was maroon. When they saw it, they knew it. I took great care of it, as women took care of me. They loved it as much as I did. I became confident behind its sun-burned steering wheel and cracked door panels. They always saw my confidence in my truck.`
  }
];

function emphasize(t){ return t.replace(/\*(.+?)\*/g, "<em>$1</em>"); }
function adCaps(t){ return t.replace(/\b[A-Z]{2,}\b/g, '<span class="ad-caps">$&</span>'); }
function isEpigraph(p){
  return /^["“'‘].*["”'’]\s*$/.test(p) && p.length < 160 && !p.includes("\n");
}
function caseNum(i){ return String(i+1).padStart(2, "0"); }

// ---------- CONTENTS ----------
const tocList = document.getElementById("tocList");
stories.forEach((s, i) => {
  const row = document.createElement("div");
  row.className = "toc-row";
  row.tabIndex = 0;
  row.setAttribute("role","button");
  row.innerHTML = `<span class="toc-num">${caseNum(i)}</span><span class="toc-label">${s.title}</span>`;
  const open = () => { openReader(s.id); closeTOC(); };
  row.addEventListener("click", open);
  row.addEventListener("keydown", ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); open(); } });
  tocList.appendChild(row);
});

const tocPanel = document.getElementById("tocPanel");
const tocOverlay = document.getElementById("tocOverlay");
function openTOC(){ tocPanel.classList.add("open"); tocOverlay.classList.add("open"); }
function closeTOC(){ tocPanel.classList.remove("open"); tocOverlay.classList.remove("open"); }
document.getElementById("tocToggle").addEventListener("click", openTOC);
tocOverlay.addEventListener("click", closeTOC);

document.getElementById("beginReading").addEventListener("click", () => {
  openReader(stories[0].id);
});
document.getElementById("anotherCase").addEventListener("click", () => {
  const idx = stories.findIndex(x => x.id === currentId);
  const next = stories[(idx + 1) % stories.length]; // loops back to the first after the last
  openReader(next.id);
});

// ---------- READER ----------
const reader = document.getElementById("reader");
let currentId = null;
let currentEntryRef = null;

function openReader(id){
  const s = stories.find(x => x.id === id);
  if(!s) return;
  currentId = id;
  currentEntryRef = s;
  const idx = stories.findIndex(x => x.id === id);

  document.getElementById("readerEyebrow").textContent = `Recovered — No. ${caseNum(idx)}`;
  document.getElementById("readerTitle").textContent = s.title;
  document.getElementById("titleNum").textContent = caseNum(idx);
  document.getElementById("titleEyebrow").textContent = "Recovered";
  document.getElementById("titleHeading").textContent = s.title;
  document.getElementById("titleSub").textContent = `No. ${caseNum(idx)}`;

  const textEl = document.getElementById("readerText");
  const paras = s.text.split("\n\n").map(p => p.trim());
  let bodyParas = paras;
  let html = "";
  if(isEpigraph(paras[0])){
    html += `<blockquote class="epigraph">${emphasize(paras[0])}</blockquote>`;
    bodyParas = paras.slice(1);
  }
  const applyAd = t => s.adStyle ? adCaps(emphasize(t)) : emphasize(t);
  if(s.intro){
    html += `<p class="intro-line">${applyAd(s.intro)}</p>`;
  }
  html += bodyParas.map((p,i) => `<p${i===0 ? ' class="lead-para"' : ""}>${applyAd(p)}</p>`).join("");
  if(s.outro){
    html += `<p class="outro-line">${applyAd(s.outro)}</p>`;
  }
  textEl.innerHTML = html;

  reader.classList.add("open");
  reader.scrollTop = 0;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => layoutPagination(true));
  // Mobile browsers (especially iOS Safari) can report a stale viewport size
  // on first paint while the address bar is still settling. Re-measure shortly
  // after to correct for that, rather than requiring the user to rotate the
  // device to trigger a resize event that happens to fix it.
  setTimeout(() => { if(currentId) layoutPagination(false); }, 400);
}

function closeReader(){
  reader.classList.remove("open");
  document.body.style.overflow = "";
  currentId = null;
}

// On desktop there's no swipe, so going back to the previous story was only
// possible via Contents. Repurpose the back arrow there to step backward
// through the sequence, same wraparound as "Next Fragment." Mobile/tablet
// keep the arrow's original job — exiting the reader — since continuous
// swipe already handles story-to-story navigation there.
function handleBackClick(){
  if(!isMobilePaged() && currentId){
    const idx = stories.findIndex(x => x.id === currentId);
    const prev = stories[(idx - 1 + stories.length) % stories.length];
    openReader(prev.id);
  } else {
    closeReader();
  }
}

document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && currentId) closeReader();
});

// ---------- GATE ----------
// Change the word below to set your own password. That's the only edit needed.
const SITE_PASSWORD = "waved";

document.body.classList.add("locked");
document.getElementById("gateForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  const val = document.getElementById("gateInput").value.trim().toLowerCase();
  if(val === SITE_PASSWORD.toLowerCase()){
    document.body.classList.remove("locked");
    document.getElementById("gate").classList.add("hidden");
  } else {
    document.getElementById("gateError").textContent = "Not quite — try again.";
    document.getElementById("gateInput").value = "";
    document.getElementById("gateInput").focus();
  }
});

// ---------- PAGER (mobile swipe pagination) ----------
function isMobilePaged(){
  return window.matchMedia("(max-width:1024px)").matches;
}

function titleSlotHtml(story, idx){
  return `<p class="title-num">${caseNum(idx)}</p>
    <p class="eyebrow">Recovered</p>
    <h3>${story.title}</h3>
    <p class="title-sub">No. ${caseNum(idx)}</p>`;
}

// Builds one continuous, flat sequence of slots spanning the ENTIRE
// collection — each story's title card, then its text pages, then straight
// into the next story's title card — so swiping never has to "reset."
function buildAllSlots(pageW, availH){
  const slots = [];
  stories.forEach((story, storyIdx) => {
    slots.push({ type:"title", storyIdx, html: titleSlotHtml(story, storyIdx) });
    buildPages(story, pageW, availH).forEach(html => {
      slots.push({ type:"text", storyIdx, html });
    });
  });
  return slots;
}

function buildPages(s, pageW, availH){
  const paras = s.text.split("\n\n").map(p => p.trim());
  let bodyParas = paras;
  const blocks = [];
  if(isEpigraph(paras[0])){
    blocks.push({type:"epigraph", text:paras[0]});
    bodyParas = paras.slice(1);
  }
  if(s.intro){
    blocks.push({type:"intro", text:s.intro});
  }
  bodyParas.forEach((p, i) => {
    blocks.push({type:"p", text:p, lead:(i === 0)});
  });
  if(s.outro){
    blocks.push({type:"outro", text:s.outro});
  }

  const probe = document.createElement("div");
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.left = "-9999px";
  probe.style.top = "0";
  probe.style.width = pageW + "px";
  probe.className = "reader-text paginated";
  document.body.appendChild(probe);

  // .reader-text.paginated now has real padding (so text doesn't sit flush
  // against the torn/burnt edge of the paper). box-sizing:border-box means
  // that padding eats into the box's own declared height, so the true usable
  // budget for packing text is smaller than the box's full height.
  const probeStyle = getComputedStyle(probe);
  const vPad = parseFloat(probeStyle.paddingTop || "0") + parseFloat(probeStyle.paddingBottom || "0");
  const budgetH = Math.max(80, availH - vPad);

  function nodeFor(block, text, lead){
    const wrapper = document.createElement("div");
    const applyAd = t => s.adStyle ? adCaps(emphasize(t)) : emphasize(t);
    if(block.type === "epigraph"){
      wrapper.innerHTML = `<blockquote class="epigraph">${applyAd(text)}</blockquote>`;
    } else if(block.type === "intro"){
      wrapper.innerHTML = `<p class="intro-line">${applyAd(text)}</p>`;
    } else if(block.type === "outro"){
      wrapper.innerHTML = `<p class="outro-line">${applyAd(text)}</p>`;
    } else {
      wrapper.innerHTML = `<p${lead ? ' class="lead-para"' : ""}>${applyAd(text)}</p>`;
    }
    return wrapper.firstElementChild;
  }

  function measure(node){
    probe.appendChild(node);
    const h = node.getBoundingClientRect().height + parseFloat(getComputedStyle(node).marginBottom || "0");
    probe.removeChild(node);
    return h;
  }

  const pages = [];
  let currentHtml = [];
  let currentHeight = 0;

  function flushPage(){
    pages.push(currentHtml.join(""));
    currentHtml = [];
    currentHeight = 0;
  }

  blocks.forEach(block => {
    if(block.type === "epigraph" || block.type === "intro" || block.type === "outro"){
      const node = nodeFor(block, block.text, false);
      const h = measure(node);
      if(currentHtml.length > 0 && currentHeight + h > budgetH) flushPage();
      currentHtml.push(node.outerHTML);
      currentHeight += h;
      return;
    }

    let remaining = block.text;
    let isContinuation = false;

    while(remaining.length){
      const lead = block.lead && !isContinuation;
      const fullNode = nodeFor(block, remaining, lead);
      const fullH = measure(fullNode);

      if(currentHeight + fullH <= budgetH){
        currentHtml.push(fullNode.outerHTML);
        currentHeight += fullH;
        remaining = "";
        break;
      }

      const words = remaining.split(" ");
      let lo = 1, hi = words.length, best = 0;
      while(lo <= hi){
        const mid = Math.floor((lo + hi) / 2);
        const candText = words.slice(0, mid).join(" ");
        const candNode = nodeFor(block, candText, lead);
        const candH = measure(candNode);
        if(currentHeight + candH <= budgetH){ best = mid; lo = mid + 1; }
        else { hi = mid - 1; }
      }

      if(best === 0){
        if(currentHtml.length === 0){
          best = 1;
        } else {
          flushPage();
          continue;
        }
      }

      const fitText = words.slice(0, best).join(" ");
      const fitNode = nodeFor(block, fitText, lead);
      const fitH = measure(fitNode);
      currentHtml.push(fitNode.outerHTML);
      currentHeight += fitH;
      remaining = words.slice(best).join(" ");
      isContinuation = true;
      flushPage();
    }
  });

  if(currentHtml.length) flushPage();

  document.body.removeChild(probe);
  return pages.length ? pages : [""];
}

let slotIndex = 0;
let allSlots = [];

function syncCurrentStoryFromSlot(){
  const slot = allSlots[slotIndex];
  if(!slot) return;
  const story = stories[slot.storyIdx];
  if(story && story.id !== currentId){
    currentId = story.id;
    currentEntryRef = story;
  }
}

function layoutPagination(resetToStart){
  const pager = document.getElementById("pager");
  const track = document.getElementById("pagerTrack");
  const titlePage = document.getElementById("titlePage"); // legacy static template, unused on mobile now
  const textEl = document.getElementById("readerText");

  track.querySelectorAll(".gen-slot").forEach(el => el.remove());

  if(!isMobilePaged()){
    pager.classList.remove("paginated");
    textEl.style.display = "";
    titlePage.style.display = "none";
    track.style.transform = "";
    pager.style.height = "";
    return;
  }

  if(!currentEntryRef) return;

  pager.classList.add("paginated");
  textEl.style.display = "none";
  titlePage.style.display = "none";

  // The "Next Fragment" button is hidden in paginated (mobile/tablet) mode now
  // that swiping crosses story boundaries directly, so there's no button row
  // to leave room for below the card anymore — just a small safety margin.
  const top = pager.offsetTop;
  const footerAllowance = 24;
  const viewportH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const maxAvailH = Math.max(280, viewportH - top - footerAllowance);

  // Give both card types more room than before — the earlier 0.74 trim (done
  // to stop the hint from being pushed off-screen) went too far the other
  // way and started hurting readability. This still leaves enough margin for
  // the hint to sit comfortably below the card without needing to scroll.
  const availH = Math.round(maxAvailH * 0.85);
  pager.style.height = availH + "px";

  const pageW = pager.clientWidth;

  // Title cards have very little content (a numeral, a label, a title), so
  // they get a shorter height still, centered within the pager. Text pages
  // nearly fill it. Pack text against the actual rendered text-slide height,
  // not the full availH, or content would overflow the shorter box and get
  // clipped at the bottom.
  const titleH = Math.round(availH * 0.68);
  const textH = Math.round(availH * 0.97);

  allSlots = buildAllSlots(pageW, textH);

  allSlots.forEach(slot => {
    const el = document.createElement("div");
    const isTitle = slot.type === "title";
    el.className = "gen-slot " + (isTitle ? "title-page" : "reader-text paginated page-slide");
    el.style.width = pageW + "px";
    el.style.height = (isTitle ? titleH : textH) + "px";
    if(isTitle) el.style.alignSelf = "center";
    el.innerHTML = slot.html;
    track.appendChild(el);
  });

  if(resetToStart){
    const storyIdx = stories.findIndex(s => s.id === currentId);
    const targetIdx = allSlots.findIndex(sl => sl.type === "title" && sl.storyIdx === storyIdx);
    slotIndex = targetIdx >= 0 ? targetIdx : 0;
  } else {
    slotIndex = Math.min(slotIndex, allSlots.length - 1);
  }

  applyPageTransform();
  updateHint();
  syncCurrentStoryFromSlot();
}

function applyPageTransform(){
  const pager = document.getElementById("pager");
  const track = document.getElementById("pagerTrack");
  const pageW = pager.clientWidth;
  track.style.transform = `translateX(${-slotIndex * pageW}px)`;
}

function updateHint(){
  const hint = document.getElementById("pagerHint");
  if(!isMobilePaged() || !allSlots.length) return;
  const slot = allSlots[slotIndex];
  if(!slot) return;
  if(slot.type === "title"){
    hint.innerHTML = '<span class="hint-arrow">&rsaquo;&rsaquo;</span> swipe to begin';
  } else {
    const textSlots = allSlots.filter(sl => sl.storyIdx === slot.storyIdx && sl.type === "text");
    const pos = textSlots.indexOf(slot) + 1;
    hint.textContent = `page ${pos} of ${textSlots.length}`;
  }
}

function goToPage(delta){
  if(!allSlots.length) return;
  // Wraps in both directions — swipe past the last page of the last story
  // and you're back at the first story's title card; swipe backward from
  // a title card and you land on the previous story's last page.
  slotIndex = (slotIndex + delta + allSlots.length) % allSlots.length;
  applyPageTransform();
  updateHint();
  syncCurrentStoryFromSlot();
}

(function setupSwipe(){
  const pager = document.getElementById("pager");
  let startX = 0, startY = 0;
  pager.addEventListener("touchstart", ev => {
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
  }, {passive:true});
  pager.addEventListener("touchend", ev => {
    if(!isMobilePaged()) return;
    const dx = ev.changedTouches[0].clientX - startX;
    const dy = ev.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      goToPage(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
})();

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(currentId) layoutPagination(); }, 150);
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if(currentId) layoutPagination(); }, 150);
  });
}
window.addEventListener("load", () => { if(currentId) layoutPagination(); });
</script>
